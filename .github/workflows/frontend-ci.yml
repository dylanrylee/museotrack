name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - "frontend/**"
      - "Dockerfile.frontend"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "Dockerfile.frontend"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Run tests (if present)
        working-directory: frontend
        run: npm test --if-present -- --watch=false

      - name: Build app
        working-directory: frontend
        run: npm run build

      - name: Normalize build output (works for Vite or CRA)
        working-directory: frontend
        run: |
          if [ -d "dist" ]; then mv dist site; fi
          if [ -d "build" ]; then mv build site; fi
          test -d site

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-site
          path: frontend/site

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t museotrack-frontend:ci .

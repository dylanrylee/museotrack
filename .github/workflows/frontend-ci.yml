name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths: ["frontend/**", "Dockerfile.frontend", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "Dockerfile.frontend", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15           # hard cap
    defaults: { run: { working-directory: frontend } }
    env:
      VITE_API_URL: http://localhost:8000
      REACT_APP_API_URL: http://localhost:8000
      NODE_OPTIONS: --max-old-space-size=4096
      CI: ""                      # avoid CRA warnings-as-errors

    steps:
      - uses: actions/checkout@v4

      - name: Show scripts
        run: node -e "console.log(require('./package.json').scripts||{})"

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then echo "name=pnpm" >> $GITHUB_OUTPUT
          elif [[ -f yarn.lock ]]; then echo "name=yarn" >> $GITHUB_OUTPUT
          else echo "name=npm" >> $GITHUB_OUTPUT; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/yarn.lock
            frontend/pnpm-lock.yaml

      - name: Install pnpm
        if: steps.pm.outputs.name == 'pnpm'
        run: npm i -g pnpm@9

      - name: Install deps (fast)
        run: |
          if [ "${{ steps.pm.outputs.name }}" = "pnpm" ]; then
            pnpm i --frozen-lockfile --prefer-offline || pnpm i
          elif [ "${{ steps.pm.outputs.name }}" = "yarn" ]; then
            yarn install --frozen-lockfile --prefer-offline || yarn install
          else
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          fi

      - name: Build app
        run: |
          if [ "${{ steps.pm.outputs.name }}" = "pnpm" ]; then pnpm run build
          elif [ "${{ steps.pm.outputs.name }}" = "yarn" ]; then yarn build
          else npm run build; fi

      - name: Normalize build output (dist/build/out)
        run: |
          if [ -d dist ]; then mv dist site; fi
          if [ -d build ]; then mv build site; fi
          if [ -d out ];  then mv out site;  fi
          test -d site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-site
          path: frontend/site

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "---- npm logs ----"
          if [ -d "$HOME/.npm/_logs" ]; then ls -la $HOME/.npm/_logs; tail -n +1 $HOME/.npm/_logs/* || true; fi
          if [ -f "yarn-error.log" ]; then echo "---- yarn-error.log ----"; cat yarn-error.log; fi

name: Frontend CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cd.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  S3_BUCKET: museotrack-web-981986259169
  CF_DISTRIBUTION_ID: E2B4OT8PMH2IU4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build (don’t fail on warnings)
        working-directory: frontend
        env:
          CI: "false"
        run: |
          npm ci
          npm run build


      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981986259169:role/MuseoTrack-FrontendDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static assets (hashed) with long cache
        run: |
          aws s3 cp frontend/dist/ s3://$S3_BUCKET/ --recursive \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp frontend/dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID \
            --paths "/*"

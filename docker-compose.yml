services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: museotrack
      MYSQL_USER: museouser
      MYSQL_PASSWORD: museopass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20
    # NOTE: No ports exposed (Option A)

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - backend.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
    #   dockerfile defaults to ./Dockerfile (we set it explicitly below)
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  dbdata:
